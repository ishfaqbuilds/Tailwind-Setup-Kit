<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#050b16"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#20d7ff" stroke-opacity="0.55" stroke-width="2.5"/>
  <g filter="url(#glow)">
    <text x="32" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="700" fill="#20d7ff" text-anchor="middle">//</text>
  </g>
</svg>
